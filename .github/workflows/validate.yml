name: Validate portfolio

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fallback-app/package-lock.json
      - name: Install dependencies
        run: npm ci && npm --prefix fallback-app ci --include=dev
      - name: Run tests
        run: npm test
      - name: Build portfolio
        run: npm run build
